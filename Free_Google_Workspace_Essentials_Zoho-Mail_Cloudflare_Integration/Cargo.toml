[package]
name = "sentinel-rs"
version = "0.1.0"
edition = "2021"
authors = ["Pei Chen Lee (Dennis)"]
description = "DNS & Identity Gap Checker for Google/Zoho Integration"

[dependencies]
# 異步執行引擎 (Async runtime)
tokio = { version = "1.35", features = ["full"] }

# 序列化與 JSON 解析 (Serialization)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 網路請求 (HTTP Client)
reqwest = { version = "0.11", features = ["json"] }

# 終端機色彩輸出 (Terminal styling)
console = "0.15"

# 錯誤處理
color-eyre = "0.6"

# 階段 1：設定檔與環境變數
dotenvy = "0.15"
toml = "0.8"

# 階段 2：Google / Zoho API
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# 階段 3：DNS 健康檢查
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }

# 階段 4：Checker trait（async fn in trait）
async-trait = "0.1"

# 階段 6：CLI 與輸出
clap = { version = "4", features = ["derive"] }
